[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"
[project]
name = "quant-windows-handoff"
version = "0.7.0.post1"
description = "Offline-hardened Windows capture and non-actionable WSL audit"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
quant-win-capture = "win_capture.capture:main"
quant-win-audit = "wsl_handoff.importer:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["win_capture*", "wsl_handoff*"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
