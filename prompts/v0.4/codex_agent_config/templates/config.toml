# Project-local Codex agent routing configuration.
#
# Do NOT set the root `model` or `model_reasoning_effort` here.
# The user-selected root/session model should remain authoritative.

[agents]
enabled = true

# Generic spawned workers should default to an economical but capable model.
# Named roles below may override this through their role config.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"

# Keep orchestration shallow and bounded. More agents are not automatically better.
max_concurrent_threads_per_session = 3
interrupt_message = true

[agents.mechanical]
description = "Deterministic repetitive edits such as renames, fixture synchronization, formatting, simple config/text updates, and established-pattern changes. Use only when no new semantic judgment is required."
config_file = "./agents/mechanical.toml"
nickname_candidates = ["Patch"]

[agents.explorer]
description = "Read-heavy targeted repository exploration: locate symbols, call sites, dependencies, relevant tests, configuration, and concise failure evidence. Prefer bounded output and do not modify project files."
config_file = "./agents/explorer.toml"
nickname_candidates = ["Scout"]

[agents.reviewer]
description = "Independent correctness review for consequential changes, especially cross-module invariants, PIT/causal-time correctness, execution/economic semantics, public contracts, and difficult acceptance logic."
config_file = "./agents/reviewer.toml"
nickname_candidates = ["Audit"]
