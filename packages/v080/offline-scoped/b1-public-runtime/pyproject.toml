[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-personal-public-b1"
version = "0.8.0b1"
description = "Offline PERSONAL_MVP public market runtime and causal replay"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quant-public-b1 = "quant_personal_public_b1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_personal_public_b1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
