[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-personal-decision-b2"
version = "0.8.0b2"
requires-python = ">=3.11"
dependencies = ["quant-personal-public-b1==0.8.0b1"]
description = "Offline PERSONAL_MVP causal market decision and operator journal"

[project.scripts]
quant-decision-b2 = "quant_personal_decision_b2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_personal_decision_b2"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["quant_personal_public_b1", "quant_personal_public_b1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
