[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-personal-live-public-b5"
version = "0.8.0b5.post4"
description = "QUANT S3 release-bound zero-retry offline candidate (H2-A three-file signed-profile derivative)"
requires-python = ">=3.11"
dependencies = ["quant-personal-public-b1==0.8.0b1", "quant-personal-decision-b2==0.8.0b2", "quant-personal-public-bridge-b4==0.8.0b4"]

[project.optional-dependencies]
activation-verifier = ["cryptography==45.0.7"]

[project.scripts]
quant-public-b5 = "quant_personal_live_public_b5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_personal_live_public_b5 = ["dependency_lock.json"]
