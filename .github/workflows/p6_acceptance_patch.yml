name: P6 acceptance repair patch

on:
  push:
    branches: [v0.4]
    paths:
      - .github/workflows/p6_acceptance_patch.yml
      - tools/apply_v041e_acceptance_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply narrow P6 repair
        run: python tools/apply_v041e_acceptance_patch.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p6): bind dataset run gates and comparability'
          git push origin HEAD:v0.4
