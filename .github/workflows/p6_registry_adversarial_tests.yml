name: P6 registry adversarial test patch

on:
  push:
    branches: [v0.4]
    paths:
      - .github/workflows/p6_registry_adversarial_tests.yml
      - tools/apply_v041e_registry_adversarial_tests.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply registry adversarial tests
        run: python tools/apply_v041e_registry_adversarial_tests.py
      - name: Commit tests and remove helper
        run: |
          rm -f tools/apply_v041e_registry_adversarial_tests.py .github/workflows/p6_registry_adversarial_tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(p6): exercise rehashed forgeries through registry'
          git push origin HEAD:v0.4
