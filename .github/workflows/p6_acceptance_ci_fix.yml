name: P6 acceptance CI repair

on:
  push:
    branches: [v0.4]
    paths:
      - .github/workflows/p6_acceptance_ci_fix.yml
      - tools/apply_v041e_ci_ruff_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply ruff-only repair
        run: python tools/apply_v041e_ci_ruff_fix.py
      - name: Commit repair and remove helper
        run: |
          rm -f tools/apply_v041e_ci_ruff_fix.py .github/workflows/p6_acceptance_ci_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p6): satisfy ruff exception typing'
          git push origin HEAD:v0.4
