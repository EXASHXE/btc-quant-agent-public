name: CI

on:
  push:
    paths-ignore:
      - "prompts/**"
      - "reviews/**"
      - "REFACTOR_DOCS_BRANCH.md"
  pull_request:
    paths-ignore:
      - "prompts/**"
      - "reviews/**"
      - "REFACTOR_DOCS_BRANCH.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: docs-branch safety (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,research]'
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - run: python -m compileall -q src skill-template/scripts
