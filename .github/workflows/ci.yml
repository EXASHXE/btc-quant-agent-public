name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "focused/integration/full (manual exact SHA gates)"
        required: true
        default: focused
        type: choice
        options: [focused, integration, full]
  schedule:
    - cron: "21 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Risk-based quality (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build fail-closed test plan
        env:
          BEFORE_SHA: "${{ github.event.before }}"
          EVENT_NAME: "${{ github.event_name }}"
        run: python scripts/ci/test_plan.py plan --before "$BEFORE_SHA" --event "$EVENT_NAME"
      - run: python -m pip install -e '.[dev,research]'
      - name: All Ruff rules; bounded legacy EXE001 debt check
        run: python scripts/ci/test_plan.py lint
      - run: mypy
      - run: python -m compileall -q src scripts tests
      - name: Tests selected by risk/changed scope
        env:
          PROFILE: "${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'focused') }}"
        run: python scripts/ci/test_plan.py run --profile "$PROFILE"
      - name: Retain scoped test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-line-test-receipt-${{ github.sha }}
          path: |
            ci-test-plan.json
            ci-junit.xml
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Compatibility manual full suite
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,research]'
      - run: pytest -q --durations=20
