name: RC2 R1.1 L2 Exact-SHA Focused Qualification

on:
  push:

permissions:
  contents: read

jobs:
  qualification:
    name: Immutable runner targeted checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a5756663ecf56ed6c02a7355840f33e6715ea22
          fetch-depth: 0
      - name: Assert target implementation SHA and expected branch
        run: |
          test "$(git rev-parse HEAD)" = "1a5756663ecf56ed6c02a7355840f33e6715ea22"
          git switch -C validation/b-line-rc2-final-holdout-infra-repair-r1
          git fetch origin +refs/heads/v0.5.5-docs:refs/remotes/origin/v0.5.5-docs
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install hermetic test requirements
        run: python -m pip install -e '.[dev,research]'
      - name: Static source contracts (baseline lint debt separately enumerated)
        run: |
          git diff --check 1a5756663ecf56ed6c02a7355840f33e6715ea22^ 1a5756663ecf56ed6c02a7355840f33e6715ea22
          ruff check scripts/rc2/validation/run_holdout_r3.py tests/test_rc2_final_holdout_infra_repair_r1.py --ignore EXE001
          python -m compileall -q scripts/rc2/validation tests/test_rc2_final_holdout_infra_repair_r1.py
      - name: Focused R1.1 adversarial suite at exact implementation SHA
        run: pytest -q --durations=20 --junitxml=rc2-r11-junit.xml tests/test_rc2_final_holdout_infra_repair_r1.py
      - name: Reconfirm inherited freeze identity checks
        run: pytest -q --durations=10 -k "test_verify_freeze_identity_function or test_freeze_repair_identity_function" tests/test_rc2_holdout_r3_runner_freeze.py tests/test_rc2_holdout_r3_runner_repair_r1.py
      - name: Upload exact-SHA focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-r11-l2-exact-sha-qualification
          path: rc2-r11-junit.xml
          if-no-files-found: warn
