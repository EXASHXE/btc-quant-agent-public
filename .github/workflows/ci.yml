name: Independent H40 Scientific Golden Baseline-vs-G1
on:
  push:
    branches: [validation/v06-g1-h40-baseline-diff-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: H40 golden isolated (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: baseline
            sha: d6500140f3141d179181f2360ad815b5bfe9c954
          - target: g1
            sha: 6eef811961bfbe1341eee79b2450a4266d277302
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated same-source dependencies
        run: python -m pip install -e '.[dev,research]'
      - name: Print exact test identity
        run: |
          git rev-parse HEAD
          python --version
          python -m pytest --version
      - name: Isolated H40 SHA golden (no full test suite)
        run: python -m pytest -q --maxfail=1 --tb=short tests/test_v051_h40_m3a_production_discovery_producer.py::test_p09_through_p18_exact_scientific_graph
