name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,research]'
      - run: ruff check .
      - run: mypy
      - name: Full test suite
        if: github.event_name != 'workflow_dispatch'
        run: pytest -q
      - name: Full test suite with coverage
        if: github.event_name == 'workflow_dispatch'
        run: pytest -q --cov=btc_quant_agent --cov-report=term-missing
      - run: python -m compileall -q src skill-template/scripts

  compatibility:
    name: compatibility (${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,research]'
      - run: pytest -q
      - run: python -m compileall -q src skill-template/scripts
